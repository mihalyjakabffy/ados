# ADOS 1.0 — Rule Registry
# Authoritative machine-readable index of every normative rule.
# Generated from the specification volumes; prose and registry shall not disagree (ADOS-7.1.010).
#
# Field semantics
#   id           Immutable rule identifier (ADOS-A.1.010). Never reused, never renumbered.
#   name         Short name as it appears in the volume heading.
#   volume       Volume number (0-8, A) and title.
#   chapter      Chapter within the volume.
#   level        shall | should | may  — requirement level (ADOS-0.3.2.4).
#   severity     S1..S4 per ADOS-8.9.010. S1 rules are marked with a warning glyph in the prose.
#                Rules not marked S1 default to S3 here; where a rule is exercised by a metric,
#                the severity in ados-validation.yaml governs.
#   principles   Principle references (P1..P9, ADOS-0.3). Every rule traces to at least one.
#   evidence     Evidence class of the rule's numeric basis: P V C R I A (ADOS-0.8).
#   validation   Validation procedure identifier, defined in ados-validation.yaml.
#   classes      Conformance classes in which the rule applies (A, B, C — ADOS-0.3.1).
#   source       File in which the rule is defined.

edition: "1.0"
generated_from: specification volumes 0-8 and appendix
rule_count: 476
severity_default_for_unmarked: S3
levels: [shall, should, may]
principles:
  P1: Function precedes form
  P2: One fact, one place
  P3: Encode meaning in the strongest available channel
  P4: Hierarchy shall be explicit and shallow
  P5: Consistency outranks local optimisation
  P6: The reader's context is adverse
  P7: Every rule shall be checkable
  P8: Automation-readiness is a design constraint
  P9: Absence shall be explicit
evidence_classes:
  P: physical
  V: perceptual
  C: cognitive
  R: procedural
  I: interoperability
  A: arithmetic
severities:
  S1: Could cause a construction error, a safety consequence, or renders information unusable
  S2: Degrades reliability or breaks the reader's template
  S3: Reduces efficiency; no correctness consequence
  S4: Refinement

