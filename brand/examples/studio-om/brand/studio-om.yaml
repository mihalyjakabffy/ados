    concept: 'OM is read as a pair, not as a word: O is the opening, M is the mass.
      Architecture is the negotiation between what is cut away and what is left standing,
      and in an existing building that negotiation is the whole job. The mark is a
      square aperture — a threshold seen in plan — constructed on the same module
      the sheets are set on. It is a fragment of a drawing rather than a picture of
      a building.'
    incorrect_uses:
    - Do not rotate the aperture — it is a plan, and a plan has an up.
    - Do not fill the aperture with an image.
    - Do not outline, emboss, or add a shadow.
    - Do not stretch, condense, or re-set the wordmark in another face.
    - Do not place the mark on a tone darker than T1; use the reversed lockup.
    - Do not reduce the primary lockup below 28 mm; use the compact mark.
    - Do not recolour the mark in the accent.
    usage_rules:
