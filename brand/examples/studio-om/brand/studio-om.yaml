identity:
  name: STUDIO OM
  descriptor: Architecture, interiors and adaptive reuse
  tagline: Opening and mass
  positioning: A practice that works from what is already standing. Every project
    begins with a survey rather than a sketch, and the existing building is treated
    as the primary material — measured, kept where it performs, and cut where it does
    not.
  mission: To make reuse the ordinary choice by showing, project by project, that
    an existing structure carries more value than the one that would replace it.
  vision: A practice whose drawings are read by builders without a phone call, and
    whose buildings are recognised without a signature.
  values:
  - Survey before proposal
  - Keep what performs
  - Show the joint
  - Measure the claim
  - Detail once, well
  - Answer plainly
