<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A3 Technical Document — STUDIO OM</title>
<style>

:root {
  --font-primary: Inter, Arial, sans-serif;
  --size-xs: 1.8mm;
  --size-sm: 2.5mm;
  --size-md: 3.5mm;
  --size-lg: 5.0mm;
  --weight-regular: 400;
  --weight-medium: 500;
  --leading: 1.45;
  --tracking-caps: 3.0%;
  --bg: #f2f0eb;
  --surface: #fbfaf7;
  --text: #1a1a18;
  --text-2: #4d5149;
  --border: #d6d2c8;
  --accent: #64726b;
  --gutter: 10.0mm;
  --margin: 20.0mm;
  --baseline: 5.0mm;
  --space-1: 5.0mm;
  --space-2: 10.0mm;
  --space-3: 20.0mm;
  --columns: 6;
  --rule: 0.18mm;
}
@page { size: 420mm 297mm; margin: var(--margin); }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body {
  font-family: var(--font-primary);
  font-size: var(--size-sm);
  font-weight: var(--weight-regular);
  line-height: var(--leading);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.sheet {
  max-width: 420mm;
  margin: 0 auto;
  padding: var(--margin);
  background: var(--bg);
}
.masthead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-2);
  padding-bottom: var(--space-1);
  border-bottom: var(--rule) solid var(--text);
  margin-bottom: var(--space-3);
}
.wordmark {
  font-size: var(--size-md);
  font-weight: var(--weight-medium);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
}
.descriptor { font-size: var(--size-xs); color: var(--text-2); }
h1, h2, h3 { font-weight: var(--weight-medium); margin: 0 0 var(--space-1) 0; }
h1 { font-size: var(--size-lg); text-transform: uppercase; letter-spacing: var(--tracking-caps); }
h2 { font-size: var(--size-md); }
h3 {
  font-size: var(--size-sm);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
  color: var(--text-2);
}
p { margin: 0 0 var(--space-1) 0; max-width: 67ch; }
section { margin-bottom: var(--space-3); }
.rows { display: grid; gap: 0; }
.row {
  display: grid;
  grid-template-columns: 1fr 3fr;
  gap: var(--gutter);
  padding: calc(var(--baseline) / 2) 0;
  border-bottom: var(--rule) solid var(--border);
}
.row .k { font-size: var(--size-xs); text-transform: uppercase;
           letter-spacing: var(--tracking-caps); color: var(--text-2); }
.accent { color: var(--accent); }
.colophon {
  margin-top: var(--space-3);
  padding-top: var(--space-1);
  border-top: var(--rule) solid var(--border);
  font-size: var(--size-xs);
  color: var(--text-2);
}
/* No dark-mode override. This is a print palette: a document that changes
   colour with the reader's system setting is not the document that was
   issued. `html` already takes color.background, so the page is painted by
   the brand in either setting — and every colour on the page is one the
   brand declares, which the token-purity test enforces. */

</style>
</head>
<body>
<main class="sheet">
<header class="masthead">
  <div>
    <div class="wordmark">STUDIO OM</div>
    <div class="descriptor">Architecture, interiors and adaptive reuse</div>
  </div>
  <div class="descriptor">Malthouse · 2026-03-04</div>
</header>
<h1>A3 Technical Document</h1>
<section id="title">
  <h3>Title</h3>
  <p>[Title]</p>
</section>
<section id="table">
  <h3>Schedule</h3>
  <p>Schedule — entry 1</p>
  <p>Schedule — entry 2</p>
  <p>Schedule — entry 3</p>
</section>
<section id="notes">
  <h3>Notes</h3>
  <p>[Notes]</p>
</section>
<footer class="colophon">STUDIO OM · brand 1.0.0 · template BT02-a3-technical · ADOS 1.0</footer>
</main>
</body>
</html>
