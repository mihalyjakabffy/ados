<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<title>Email Signature (HTML) — STUDIO OM</title>
<style>
:root {
  --font: Inter, Arial, sans-serif;
  --mono: IBM Plex Mono, monospace;
  --xs: 1.8mm; --sm: 2.5mm;
  --md: 3.5mm; --lg: 5.0mm;
  --xl: 7.0mm; --display: 14.0mm;
  --w-reg: 400; --w-med: 500;
  --lead: 1.45; --track: 3.0%;
  --ink: #1a1a18; --ink-2: #4d5149;
  --paper: #f2f0eb; --surface: #fbfaf7;
  --line: #d6d2c8; --accent: #64726b;
  --s1: 5.0mm; --s2: 10.0mm; --s3: 20.0mm;
  --margin: 20.0mm; --gutter: 10.0mm;
  --rule: 0.18mm; --frame: 0.18mm;
  --clear: 1.0;
}
@page { size: 90mm 40mm; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body { font-family: var(--font); font-size: var(--sm); color: var(--ink);
        line-height: var(--lead); font-weight: var(--w-reg); }
.page { width: 90mm; height: 40mm; padding: var(--margin);
         background: var(--paper); position: relative; overflow: hidden;
         page-break-after: always; }
.caps { text-transform: uppercase; letter-spacing: var(--track); }
.med { font-weight: var(--w-med); }
.mono { font-family: var(--mono); }
.dim { color: var(--ink-2); }
.rule { border: 0; border-top: var(--rule) solid var(--ink); margin: var(--s1) 0; }
.hair { border: 0; border-top: var(--rule) solid var(--line); margin: var(--s1) 0; }
.frame { border: var(--frame) solid var(--ink); }
.imgbox { border: var(--frame) solid var(--line); background: var(--surface);
           display: flex; align-items: center; justify-content: center;
           color: var(--ink-2); font-size: var(--xs); }
.wordmark { font-size: var(--md); font-weight: var(--w-med);
             text-transform: uppercase; letter-spacing: var(--track); }

.page { display:none } body { padding: var(--s2); }

</style></head><body>
<table cellpadding="0" cellspacing="0" style="font-family:Inter,
  Arial,sans-serif;font-size:11px;color:#1a1a18;
  line-height:1.5">
  <tr><td style="padding-bottom:4px;font-weight:500;
      text-transform:uppercase;letter-spacing:3.0%">
      STUDIO OM</td></tr>
  <tr><td style="color:#4d5149;padding-bottom:6px">
      Architecture, interiors and adaptive reuse</td></tr>
  <tr><td style="border-top:1px solid #d6d2c8;padding-top:6px">
      Anna Kovács ·
      Architect</td></tr>
  <tr><td style="color:#4d5149">
      anna@studio-om.example ·
      +36 1 000 0000</td></tr>
</table></body></html>
